[project]
name = "mman-tool"
version = "0.1.2"
description = "mange your files migration"
license = "MIT"
readme = "README.md"
authors = [
    { name = "johnwink", email = "johnwink1998@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
mm = "mman_tool.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/mman"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
